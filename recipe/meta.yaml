{% set name = "inflect" %}
{% set version = "7.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b46875b50534a7cd5fcfb5a7c971bb93fe68948c43ca53e9833bd1e1a69221bd

build:
  skip: true  # [py<310]
  number: 0
  script: {{ PYTHON }} -m pip install . --no-build-isolation  --no-deps --ignore-installed -vv

requirements:
  host:
    - pip
    - python
    - setuptools >=77
    - setuptools-scm >=3.4.1
    - toml
    - wheel
  run:
    - python
    - jaraco.functools
    - more-itertools >=8.5.0
    - typeguard >=4.0.1

test:
  imports:
    - inflect
  source_files:
    - pytest.ini
    - tests
  requires:
    - pip
    - pytest
  commands:
    - pip check
    - pytest -vv

about:
  home: https://github.com/jaraco/inflect
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Correctly generate plurals, singular nouns, ordinals, indefinite articles; convert numbers to words
  description: |
    Correctly generate plurals, ordinals, indefinite articles; convert numbers to words
  dev_url: https://github.com/jaraco/inflect
  doc_url: https://inflect.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - pmlandwehr
    - dbast
